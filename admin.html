<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Panel — CrowdChek</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="container" id="adminRoot">
    <div class="admin">
      <nav class="side" role="tablist" aria-label="Menu admin" id="side">
        <button role="tab" data-tab="overview" aria-selected="true">📋 Ringkasan</button>
        <button role="tab" data-tab="places" aria-selected="false">📍 Lokasi</button>
        <button role="tab" data-tab="reports" aria-selected="false">📣 Laporan</button>
        <button role="tab" data-tab="users" aria-selected="false">👥 Pengguna</button>
      </nav>
      <section id="panel" role="tabpanel" aria-live="polite"></section>
    </div>
  </main>
  <div id="site-footer"></div>

  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/map.js"></script>
  <script src="js/admin-overview.js"></script>
  <script src="js/admin-places.js"></script>
  <script src="js/admin-reports.js"></script>
  <script src="js/admin-users.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
